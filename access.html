<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toegang Verleend | encryptie.github.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      color: #00ff41;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
      animation: scanlineMove 8s linear infinite;
    }
    body::after {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 101;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
    }
    .binary-rain {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; opacity: 0.12;
      font-size: 16px; line-height: 1.4; color: #00ff41;
      text-shadow: 0 0 8px #00ff41, 0 0 16px #00ff41;
    }
    .binary-column {
      position: absolute; top: -200%; white-space: nowrap;
      animation: fall linear infinite;
      font-weight: 700;
    }
    @keyframes fall { to { transform: translateY(300vh); } }
    .grid-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; opacity: 0.04;
      background-image: 
        linear-gradient(90deg, transparent 50%, rgba(0,255,65,0.1) 50%),
        linear-gradient(transparent 50%, rgba(0,255,65,0.1) 50%);
      background-size: 80px 80px;
      animation: gridShift 60s linear infinite;
    }
    @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 80px 80px; } }
    .content { position: relative; z-index: 10; text-align: center; padding: 2rem; max-width: 700px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #00ff41; text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41; margin-bottom: 0.25rem; }
    h1::after { content: '_'; animation: cursorBlink 1s step-end infinite; margin-left: 6px; color: #00ff41; }
    @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .subtitle { font-size: clamp(0.8rem, 1.8vw, 0.95rem); color: #00cc33; margin-bottom: 2rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 8px #00cc33; }
    .success-box {
      background: rgba(0, 255, 65, 0.08);
      border: 2px solid #00ff41;
      border-radius: 8px;
      padding: 2rem;
      margin: 2rem 0;
      box-shadow: 0 0 24px rgba(0, 255, 65, 0.2);
      animation: pulseBox 2s ease-in-out infinite;
    }
    @keyframes pulseBox { 0%, 100% { box-shadow: 0 0 24px rgba(0, 255, 65, 0.2); } 50% { box-shadow: 0 0 40px rgba(0, 255, 65, 0.4); } }
    .success-icon { font-size: 3rem; margin-bottom: 1rem; animation: bounce 1s ease-in-out infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .success-text { font-size: 1.1rem; color: #00ff41; text-shadow: 0 0 8px #00ff41; }
    .details { margin-top: 1.5rem; font-size: 0.8rem; color: #008811; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
    .detail-line { margin: 0.5rem 0; font-family: inherit; }
    .detail-label { color: #00ff41; font-weight: 700; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="binary-rain" id="binaryRain"></div>
  <div class="grid-overlay"></div>
  <main class="content">
    <h1>encryptie</h1>
    <p class="subtitle">toegang verleend  beveiligde sectie</p>
    <div class="success-box">
      <div class="success-icon">✓</div>
      <div class="success-text">AUTHENTICATIE GESLAAGD</div>
      <div class="details">
        <div class="detail-line"><span class="detail-line">STATUS: </span><span class="detail-label">VERIFIED</span></div>
        <div class="detail-line"><span class="detail-line">CODE: </span><span class="detail-label">3564</span></div>
        <div class="detail-line"><span class="detail-line">LEVEL: </span><span class="detail-label">ADMIN</span></div>
        <div class="detail-line"><span class="detail-line">ENCRYPTIE: </span><span class="detail-label">AES-256-GCM</span></div>
      </div>
    </div>
    <p class="subtitle">welkom in de beveiligde omgeving</p>
  </main>
  <script>
    const binaryRain = document.getElementById('binaryRain');
    const columnCount = 50;
    for (let i = 0; i < columnCount; i++) {
      const col = document.createElement('div');
      col.className = 'binary-column';
      col.style.left = (i / columnCount * 100) + '%';
      col.style.animationDuration = (10 + Math.random() * 15) + 's';
      col.style.animationDelay = Math.random() * 20 + 's';
      col.style.fontSize = (13 + Math.random() * 6) + 'px';
      col.style.opacity = 0.15 + Math.random() * 0.25;
      let str = '';
      const len = 80 + Math.floor(Math.random() * 60);
      for (let j = 0; j < len; j++) {
        str += Math.random() < 0.5 ? '0' : '1';
        if (j % 8 === 7) str += ' ';
      }
      col.textContent = str;
      binaryRain.appendChild(col);
    }
    // Title glitch
    const title = document.querySelector('h1'); const originalText = 'encryptie';
    setInterval(() => { if (Math.random() < 0.08) { let glitched = '';
      for (let c of originalText) { glitched += Math.random() < 0.15 ? (Math.random() < 0.5 ? '0' : '1') : c; }
      title.textContent = glitched; setTimeout(() => title.textContent = originalText, 80); } }, 1500);
  </script>
</body>
</html>

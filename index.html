<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onder Constructie | encryptie.github.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      color: #00ff41;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
      animation: scanlineMove 8s linear infinite;
    }
    body::after {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 101;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
    }
    .binary-rain {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; opacity: 0.12;
      font-size: 16px; line-height: 1.4; color: #00ff41;
      text-shadow: 0 0 8px #00ff41, 0 0 16px #00ff41;
    }
    .binary-column {
      position: absolute; top: -200%; white-space: nowrap;
      animation: fall linear infinite;
      font-weight: 700;
    }
    @keyframes fall { to { transform: translateY(300vh); } }
    .grid-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; opacity: 0.04;
      background-image: 
        linear-gradient(90deg, transparent 50%, rgba(0,255,65,0.1) 50%),
        linear-gradient(transparent 50%, rgba(0,255,65,0.1) 50%);
      background-size: 80px 80px;
      animation: gridShift 60s linear infinite;
    }
    @keyframes gridShift { 0% { background-position: 0 0; } 100% { background-position: 80px 80px; } }
    .content { position: relative; z-index: 10; text-align: center; padding: 2rem; max-width: 700px; }
    .lock-container { width: 180px; height: 180px; margin: 0 auto 2rem; }
    .lock-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 16px #00ff41); }
    .lock-body { fill: none; stroke: #00ff41; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .lock-shackle { fill: none; stroke: #00ff41; stroke-width: 3; stroke-linecap: round; }
    .keyhole-outer { fill: #000; stroke: #00ff41; stroke-width: 2.5; }
    .keyhole-inner { fill: #000; stroke: #00ff41; stroke-width: 2.5; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #00ff41; text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41; margin-bottom: 0.25rem; }
    h1::after { content: '_'; animation: cursorBlink 1s step-end infinite; margin-left: 6px; color: #00ff41; }
    @keyframes cursorBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .subtitle { font-size: clamp(0.8rem, 1.8vw, 0.95rem); color: #00cc33; margin-bottom: 2rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 8px #00cc33; }
    .crypto-progress { width: 100%; max-width: 500px; margin: 0 auto 2.5rem; animation: fadeInUp 1s ease-out 0.3s both; }
    .crypto-stage { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: rgba(0, 255, 65, 0.05); border: 1px solid rgba(0, 255, 65, 0.2); border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.75rem; transition: all 0.3s ease; }
    .crypto-stage.active { border-color: #00ff41; background: rgba(0, 255, 65, 0.1); box-shadow: 0 0 16px rgba(0, 255, 65, 0.2); }
    .crypto-stage.completed { border-color: #00ff41; background: rgba(0, 255, 65, 0.07); opacity: 0.6; }
    .stage-name { color: #00ff41; font-weight: 700; }
    .stage-detail { color: #008811; font-family: inherit; }
    .stage-status { width: 18px; height: 18px; border: 2px solid rgba(0, 255, 65, 0.3); border-radius: 50%; position: relative; transition: all 0.3s; }
    .crypto-stage.active .stage-status { border-color: #00ff41; animation: statusPulse 1.5s ease-in-out infinite; }
    .crypto-stage.completed .stage-status { border-color: #00ff41; background: #00ff41; }
    .crypto-stage.completed .stage-status::after { content: ''; position: absolute; top: 2px; left: 5px; width: 4px; height: 8px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    @keyframes statusPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.5); } 50% { box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); } }
    .footer-text { font-size: 0.7rem; color: #006611; letter-spacing: 0.1em; text-transform: uppercase; animation: fadeInUp 1s ease-out 0.6s both; text-shadow: 0 0 4px #006611; }
    .footer-text a { color: #00ff41; text-decoration: none; transition: color 0.3s; text-shadow: 0 0 8px #00ff41; }
    .footer-text a:hover { color: #00ccff; text-shadow: 0 0 8px #00ccff; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="binary-rain" id="binaryRain"></div>
  <div class="grid-overlay"></div>
  <main class="content">
    <div class="lock-container">
      <svg class="lock-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Lock body: rounded rectangle centered at (100, 115), width 90, height 70 -->
        <rect class="lock-body" x="55" y="80" width="90" height="70" rx="8" ry="8"/>
        <!-- Shackle: centered on top of body, extends up -->
        <path class="lock-shackle" d="M70 80 V30 a25 25 0 0 1 60 0 v50"/>
        <!-- Keyhole outer circle: centered at (100, 115) -->
        <circle class="keyhole-outer" cx="100" cy="115" r="16"/>
        <!-- Keyhole inner: classic keyhole shape centered at (100, 115) -->
        <path class="keyhole-inner" d="M100 102 V115 a8 8 0 0 1 -16 0 V102 M100 115 a8 8 0 1 1 0 -16 8 8 0 0 1 0 16" fill="none" stroke="#00ff41" stroke-width="2.5"/>
        <!-- Algorithm labels below lock -->
        <text x="100" y="165" text-anchor="middle" fill="#00ff41" font-size="8" font-family="monospace" opacity="0.5">AES-256  ChaCha20  RSA-4096</text>
      </svg>
    </div>
    <h1>encryptie</h1>
    <p class="subtitle">onder constructie  encryptiemodules laden</p>
    <div class="crypto-progress" id="cryptoProgress">
      <div class="crypto-stage" data-stage="0"><span class="stage-name">KEY_GENERATION</span><span class="stage-detail">ENTROPIE VERZAMELEN</span><div class="stage-status"></div></div>
      <div class="crypto-stage" data-stage="1"><span class="stage-name">CIPHER_INIT</span><span class="stage-detail">S-BOXEN INITIALISEREN</span><div class="stage-status"></div></div>
      <div class="crypto-stage" data-stage="2"><span class="stage-name">BLOCK_MODE</span><span class="stage-detail">GCM / CCM CONFIGUREREN</span><div class="stage-status"></div></div>
      <div class="crypto-stage" data-stage="3"><span class="stage-name">INTEGRITY</span><span class="stage-detail">HMAC-SHA256 VERIFIEREN</span><div class="stage-status"></div></div>
      <div class="crypto-stage" data-stage="4"><span class="stage-name">DEPLOYMENT</span><span class="stage-detail">BEVEILIGD KANAAL OPENEN</span><div class="stage-status"></div></div>
    </div>
    <p class="footer-text"><a href="https://github.com/Blender-git/encryptie.github.io" target="_blank" rel="noopener">REPOSITORY</a>  ENCRYPTIE.GITHUB.IO  CVO VOLT</p>
  </main>
  <script>
    const binaryRain = document.getElementById('binaryRain');
    const columnCount = 50;
    for (let i = 0; i < columnCount; i++) {
      const col = document.createElement('div');
      col.className = 'binary-column';
      col.style.left = (i / columnCount * 100) + '%';
      col.style.animationDuration = (10 + Math.random() * 15) + 's';
      col.style.animationDelay = Math.random() * 20 + 's';
      col.style.fontSize = (13 + Math.random() * 6) + 'px';
      col.style.opacity = 0.15 + Math.random() * 0.25;
      let str = '';
      const len = 80 + Math.floor(Math.random() * 60);
      for (let j = 0; j < len; j++) {
        str += Math.random() < 0.5 ? '0' : '1';
        if (j % 8 === 7) str += ' ';
      }
      col.textContent = str;
      binaryRain.appendChild(col);
    }
    const stages = document.querySelectorAll('.crypto-stage'); let currentStage = 0;
    function animateStages() {
      stages.forEach((stage, i) => { stage.classList.remove('active', 'completed');
        if (i < currentStage) stage.classList.add('completed');
        else if (i === currentStage) stage.classList.add('active');
      });
      currentStage = (currentStage + 1) % (stages.length + 1);
      if (currentStage === stages.length) { setTimeout(() => { currentStage = 0; }, 2000); }
    }
    animateStages(); setInterval(animateStages, 3000);
    const title = document.querySelector('h1'); const originalText = 'encryptie';
    setInterval(() => { if (Math.random() < 0.08) { let glitched = '';
      for (let c of originalText) { glitched += Math.random() < 0.15 ? (Math.random() < 0.5 ? '0' : '1') : c; }
      title.textContent = glitched; setTimeout(() => title.textContent = originalText, 80); } }, 1500);
  </script>
</body>
</html>

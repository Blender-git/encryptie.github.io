<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onder Constructie | encryptie.github.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8f0;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: #00d4ff;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp 8s infinite ease-in;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Grid overlay animation */
    .grid-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .construct-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(2deg); }
    }

    .gear {
      animation: spin 4s linear infinite;
      transform-origin: center;
    }
    .gear.reverse { animation-direction: reverse; animation-duration: 3s; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff 0%, #7c4dff 50%, #ff2d95 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
      animation: textShimmer 3s ease-in-out infinite;
    }
    @keyframes textShimmer {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #9aa0b8;
      margin-bottom: 2.5rem;
      font-weight: 400;
      animation: fadeInUp 1s ease-out 0.3s both;
    }

    .progress-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 2rem;
      animation: fadeInUp 1s ease-out 0.5s both;
    }
    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #7c4dff, #ff2d95);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: progressLoad 4s ease-in-out infinite, gradientShift 2s linear infinite;
    }
    @keyframes progressLoad {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 0%; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .progress-text {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: #6c728a;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      animation: fadeInUp 1s ease-out 0.7s both;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 50px;
      font-size: 0.875rem;
      color: #b0b8d0;
      transition: all 0.3s ease;
    }
    .status-item:hover {
      border-color: #00d4ff;
      background: rgba(0, 212, 255, 0.1);
      transform: translateY(-2px);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #00d4ff;
      animation: blink 1.5s ease-in-out infinite;
    }
    .status-dot:nth-child(1) { animation-delay: 0s; }
    .status-dot:nth-child(2) { animation-delay: 0.3s; }
    .status-dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px #00d4ff; }
      50% { opacity: 0.3; box-shadow: none; }
    }

    .footer-text {
      font-size: 0.875rem;
      color: #5a5f7a;
      animation: fadeInUp 1s ease-out 1s both;
    }
    .footer-text a {
      color: #00d4ff;
      text-decoration: none;
      transition: color 0.3s;
    }
    .footer-text a:hover { color: #ff2d95; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="grid-overlay"></div>

  <main class="content">
    <svg class="construct-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: #00d4ff;">
      <circle class="gear" cx="12" cy="12" r="10"/>
      <path class="gear reverse" d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      <circle cx="12" cy="12" r="4" stroke-width="2"/>
    </svg>

    <h1>Onder Constructie</h1>
    <p class="subtitle">Deze pagina wordt opgebouwd — even geduld a.u.b.</p>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-text" id="progressText">Initialiseren...</div>
    </div>

    <div class="status-items">
      <div class="status-item"><span class="status-dot"></span>Repository gekoppeld</div>
      <div class="status-item"><span class="status-dot"></span>GitHub Pages actief</div>
      <div class="status-item"><span class="status-dot"></span>Content wordt geladen</div>
    </div>

    <p class="footer-text">
      <a href="https://github.com/Blender-git/encryptie.github.io" target="_blank" rel="noopener">Bekijk repository</a> •
      encryptie.github.io • CVO Volt opdracht
    </p>
  </main>

  <script>
    // Particle system
    const particlesContainer = document.getElementById('particles');
    const particleCount = 30;
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 8 + 's';
      p.style.animationDuration = (6 + Math.random() * 4) + 's';
      const size = 2 + Math.random() * 4;
      p.style.width = p.style.height = size + 'px';
      p.style.background = Math.random() > 0.5 ? '#00d4ff' : '#7c4dff';
      particlesContainer.appendChild(p);
    }

    // Progress text rotation
    const texts = ['Initialiseren...', 'Bestanden controleren...', 'Assets laden...', 'Bijna klaar...', 'Klaar voor launch!'];
    let idx = 0;
    const progressText = document.getElementById('progressText');
    setInterval(() => {
      idx = (idx + 1) % texts.length;
      progressText.style.opacity = 0;
      setTimeout(() => {
        progressText.textContent = texts[idx];
        progressText.style.opacity = 1;
      }, 300);
    }, 2000);
    progressText.style.transition = 'opacity 0.3s ease';
  </script>
</body>
</html>
